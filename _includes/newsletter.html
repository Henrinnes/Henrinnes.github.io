<!-- Mailchimp signup: posts straight to the Mailchimp list -->
<section class="newsletter" id="subscribe">
  <div class="container">
    <div class="newsletter-card">
      <div class="newsletter-copy">
        <p class="eyebrow">Newsletter</p>
        <h2>Join my mailing list</h2>
        <p>New posts on ransomware detection research, datasets and paper breakdowns, straight to your inbox. No spam, unsubscribe any time.</p>
      </div>

      <form class="newsletter-form" action="https://github.us20.list-manage.com/subscribe/post?u=d65e0fe90bcc9d20862678a98&amp;id=3c55116903&amp;f_id=007e16eaf0" method="post" target="_blank">
        <label class="sr-only" for="mce-FNAME">First name</label>
        <input type="text" name="FNAME" id="mce-FNAME" placeholder="First name" autocomplete="given-name" required>

        <label class="sr-only" for="mce-EMAIL">Email address</label>
        <input type="email" name="EMAIL" id="mce-EMAIL" placeholder="you@example.com" autocomplete="email" required>

        <!-- Honeypot field to prevent bot signups -->
        <div aria-hidden="true" style="position: absolute; left: -5000px;">
          <input type="text" name="b_d65e0fe90bcc9d20862678a98_3c55116903" tabindex="-1" value="">
        </div>

        <button class="btn btn-primary" type="submit">Subscribe</button>
        <p class="form-note">Your name and email are stored with Mailchimp and used only for this newsletter. <a href="{{ '/privacy/' | relative_url }}">Privacy notice</a></p>
      </form>
    </div>
  </div>
</section>
